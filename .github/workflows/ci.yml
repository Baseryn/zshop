name: ZShop CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend SPA
        run: npm run build
        env:
          VITE_API_URL: ""

  backend-check:
    name: Backend (Ruff & Pytest Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade pip and Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-asyncio ruff

      - name: Run Ruff Lint Checks
        working-directory: backend
        run: ruff check .

      - name: Run ZShop Functional Test Suites
        working-directory: backend
        run: pytest -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_TEST_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-ci-secret-key-9f83a21bce47d31f08e9a4cb

  docker-smoke-test:
    name: Docker Build & E2E Health Check
    needs: [frontend-check, backend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Container via Docker Compose
        run: docker compose up -d --build

      - name: Wait for Database Migration, Seeding & Server Warmup
        run: sleep 12

      - name: Inspect Container Logs (Debugging Context)
        run: docker compose logs

      - name: Verify Root Health Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/ || exit 1

      - name: Verify Public Catalog API Endpoint
        run: |
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/catalog/categories/ || exit 1
          echo "ZShop container is completely healthy and operational!"

      - name: Teardown Docker Container
        if: always()
        run: docker compose down