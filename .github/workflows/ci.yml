name: ZShop CI Pipeline

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript & Vite Build
        run: npm run build
        env:
          VITE_API_URL: ""

  backend-check:
    name: Backend (Ruff & Pytest Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Backend Tools & Package
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install .

      - name: Ruff Linter Check
        working-directory: backend
        run: ruff check .

      - name: Run Pytest Suite
        working-directory: backend
        run: pytest -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_TEST_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-ci-secret-key-9f83a21bce47d31f08e9a4cb

  docker-smoke-test:
    name: Docker Build & Smoke Test
    needs: [frontend-check, backend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Run via Docker Compose
        run: docker compose up -d --build

      - name: Wait for Warmup
        run: sleep 12

      - name: Inspect Logs (Debug Context)
        run: docker compose logs

      - name: Verify Root Health Endpoint
        run: curl --fail --retry 5 --retry-delay 2 http://localhost:8000/ || exit 1

      - name: Verify Public Categories Endpoint
        run: curl --fail --retry 3 --retry-delay 2 http://localhost:8000/catalog/categories/ || exit 1

      - name: Teardown Containers
        if: always()
        run: docker compose down

  all-checks-passed:
    name: all-checks-passed
    needs: [frontend-check, backend-check, docker-smoke-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All Steps Succeeded
        run: |
          if [ "${{ needs.frontend-check.result }}" != "success" ] || \
             [ "${{ needs.backend-check.result }}" != "success" ] || \
             [ "${{ needs.docker-smoke-test.result }}" != "success" ]; then
            echo "❌ One or more pipeline stages failed!"
            exit 1
          fi
          echo "🎉 All ZShop CI checks passed successfully!"